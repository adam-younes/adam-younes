{{ define "sidebar" }}
<nav class="w-64 bg-[#212529] p-4 border-r">
    <h2 class="text-lg text-[#DEE2E6] font-semibold mb-4">Notes</h2>

    <input
        id="sidebar-search"
        type="text"
        placeholder="search my notes"
        class="w-full mb-4 px-2 py-1 rounded border"
    />

    <ul id="notes-list" class="space-y-2">
        {{- range .Categories }}
        <li>
            <a
                href="/notes/{{ .Slug }}"
                class="block px-2 py-1 rounded hover:bg-gray-
                {{ if eq $.CurrentSlug .Slug }}bg-gray-300 font-bold{{ end }}">
                {{ .Title }}
            </a>
        </li>
        {{- end }}
    </ul>
</nav>

<script>
(function(){
    const input = document.getElementById('sidebar-search');
    const listItems = document.querySelectorAll('#notes-list li');
    input.addEventListener('input', function(){
        const q = this.value.trim().toLowerCase();
        listItems.forEach(li => {
            const text = li.textContent.trim().toLowerCase();
            li.style.display = text.includes(q) ? '' : 'none';
        });
    });
})();
</script>
{{ end }}
