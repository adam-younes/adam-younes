{{ define "experience" }}
<div class="relative pl-14 flex items-center">
    <!-- Timeline node -->
    <div class="absolute left-0 w-7 h-7 bg-[var(--color-text-primary)] rounded-full border-4 border-[var(--color-bg-primary)] z-10"></div>

    <!-- Timeline line segment (connects to next node, hidden for last entry via parent) -->
    <div class="timeline-line absolute left-[13px] top-1/2 h-[calc(100%+2rem)] w-0.5 bg-[var(--color-text-secondary)]"></div>

    <!-- Content card -->
    <a href="{{ .Link }}" target="_blank" class="block w-full">
        <article class="p-6 bg-[var(--color-bg-secondary)] rounded-md shadow-md hover:shadow-xl transition-all hover:rounded-xl cursor-pointer">
            <p class="text-sm text-[var(--color-text-secondary)] mb-1">{{ .DateRange }}</p>
            <h3 class="text-xl font-bold">{{ .Title }}</h3>
            <p class="text-base text-[var(--color-text-primary)] mb-2 italic">{{ .Company }}</p>
            <p class="text-base text-[var(--color-text-secondary)]">{{ .Description }}</p>
        </article>
    </a>
</div>
{{ end }}
