{{ define "aboutContent" }}

{{ template "navbar" . }}

<style>
.marquee-wrapper {
    overflow: hidden;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
}
.marquee {
    display: inline-block;
    white-space: nowrap;
    will-change: transform;
}
.marquee span {
    display: inline-block;
    margin-right: 2rem; /* adjust gap */
}
</style>

<div class="flex flex-col items-center justify-center text-[#abacb2]">
    <div class="mt-10 text-center">
        <h2 class="text-4xl font-[Raleway] text-[#DEE2E6]">About</h2>
    </div>

    <section class="mt-6">
        <p class="text-center font-[SnapItMono] text-[12pt] md:text-[20pt]">
            my name is adam younes, I am a palestinian <br/>
            software engineer and game developer <br/>
            welcome to my website.
        </p>
    </section>

    <section class="mt-10 font-[Reem_Kufi] text-[38pt]">
        <h2 class="text-4xl font-[Raleway] text-[#DEE2E6]">Skills</h2>
    </section>

    <section class="mt-6 w-full max-w-4xl marquee-wrapper">
        <div class="marquee font-[SnapItMono] text-[20pt]" id="js-marquee">
            <span>HTMX</span>
            <span>Go</span>
            <span>Rust</span>
            <span>Python</span>
            <span>TypeScript</span>
            <span>C</span>
            <span>C++</span>
            <span>Godot</span>
        </div>
    </section>
</div>

<script>
(function() {
    const marquee = document.getElementById('js-marquee');
    // duplicate all spans
    marquee.innerHTML += marquee.innerHTML;
    // now the total width is twice the original; we'll only scroll half of it.
    const totalWidth = marquee.getBoundingClientRect().width / 2;

    let offset = 0;
    const speed = 1.5;
    let lastTs = null;

    function step(ts) {
        if (lastTs !== null) {
            const delta = ts - lastTs;
            // normalize so speed holds per 60fps: delta/16.67
            offset -= speed * (delta / 16.67);

            // when we've scrolled an entire copy, jump back
            if (offset <= -totalWidth) {
                offset += totalWidth;
            }

            // apply transform
            marquee.style.transform = `translateX(${offset}px)`;
        }
        lastTs = ts;
        requestAnimationFrame(step);
    }

    window.addEventListener('load', () => {
        // force a reflow so the measurement is correct
        marquee.getBoundingClientRect();
        requestAnimationFrame(step);
    });
})();
</script>
{{ end }}
