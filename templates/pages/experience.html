{{ define "experienceContent" }}

<!-- Page heading -->
<div class="mt-10 text-center">
    <h2 class="text-4xl font-[Raleway] text-[var(--color-text-primary)]">Experience</h2>
</div>

<!-- Vertical timeline -->
<div class="mt-12 px-[5vw] font-[Raleway] text-[var(--color-text-primary)]">
    <div class="relative max-w-3xl mx-auto">
        <!-- Timeline entries (newest at top, oldest at bottom) -->
        <!-- Last child's timeline-line is hidden so line doesn't overflow past final node -->
        <div class="flex flex-col gap-8 [&>*:last-child_.timeline-line]:hidden">
            {{- range .Experience }}
            {{ template "experience" . }}
            {{- end }}
        </div>
    </div>
</div>

{{ end }}
