{{ define "notesContent" }}

<!-- Mobile: Desktop-only message -->
<div class="md:hidden flex flex-col items-center justify-center min-h-[60vh] px-8 text-center">
    <svg class="w-16 h-16 text-[var(--color-text-secondary)] mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
    </svg>
    <h2 class="text-xl font-semibold text-[var(--color-text-primary)] mb-2">Desktop Only</h2>
    <p class="text-[var(--color-text-secondary)]">
        Notes are only available on desktop devices.
    </p>
</div>

<!-- Desktop: Notes content -->
<div class="hidden md:flex min-h-screen">
    {{ template "sidebar" . }}
    <section class="flex-1 py-6 px-8 md:px-16 lg:px-24 prose prose-lg font-[DM_Mono] max-w-none">
        {{ if .CurrentNote }}
        <article class="p-6 rounded-lg shadow-sm">
            <h1 class="text-2xl font-bold mb-6 text-[var(--color-text-primary)]">{{ .CurrentNote.Title }}</h1>
            <div class="notes-content prose prose-lg max-w-none">
                {{ .CurrentNote.Content }}
            </div>
        </article>
        {{ else }}
        <p class="text-l text-[var(--color-text-secondary)]">
            Select a note from the sidebar to view its contents.
        </p>
        {{ end }}
    </section>
</div>
{{ end }}
