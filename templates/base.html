{{ define "base" }}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Adam Younes</title>
        <!-- google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Shippori+Antique+B1&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/css/output.css">
        <!-- Syntax highlighting -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" integrity="sha384-oaMLBGEzBOJx3UHwac0cVndtX5fxGQIfnAeFZ35RTgqPcYlbprH9o9PUV/F8Le07" crossorigin="anonymous">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-SDoiYpX0Rds2uJxGagpIgvo8MRGg5n25bu3kbfNTWBJfryGubn1FzSa+q15lOiTt" crossorigin="anonymous"></script>
    </head>
    <body hx-boost="true" hx-target="#main-content" hx-select="#main-content" hx-swap="innerHTML" hx-push-url="true">
        {{ if .ShowNavbar }}
        {{ template "navbar" . }}
        {{ end }}
        <main id="main-content">
            {{ .Content }}
        </main>
        <script>
            // Initialize syntax highlighting
            function initHighlighting() {
                // Map electron to c language
                document.querySelectorAll('code.language-electron').forEach(function(block) {
                    block.classList.remove('language-electron');
                    block.classList.add('language-c');
                });
                // Initialize highlight.js
                hljs.highlightAll();
            }

            // Run on initial page load
            document.addEventListener('DOMContentLoaded', initHighlighting);

            // Re-run after HTMX content swaps
            document.addEventListener('htmx:afterSwap', initHighlighting);
        </script>
    </body>
</html>
{{ end }}
